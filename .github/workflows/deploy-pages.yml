name: Deploy Quarto Course to GitHub Pages

# This workflow handles the RENDERING stage only (not generation).
# The GENERATION stage (quarto-coursegen) should be run locally to create .qmd stubs.
# This workflow assumes all .qmd files already exist in the repository.

on:
  # Runs on pushes to main branch
  push:
    branches: ["main"]
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (Argdown)
        run: |
          npm install decktape
          npm install @argdown/cli
          npm install @argdown/pandoc-filter
          npm install @argdown/image-export

      # Install system dependencies for PDF rendering and Decktape/Chrome
      # - Inkscape: converts SVG to PDF for Argdown maps in LaTeX documents
      # - librsvg2-bin: rsvg-convert for SVG processing
      # - libgbm1, libnss3, etc.: required by Puppeteer/Chrome for Decktape PDF export
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            inkscape \
            librsvg2-bin \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libasound2t64

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'
          tinytex: true  # Use TinyTeX for automatic LaTeX package installation (e.g., fontawesome6)

      - name: Install Quarto extensions
        run: |
          quarto add quarto-ext/fontawesome --no-prompt

      - name: Render Quarto website
        run: |
          quarto render

      - name: Render slides
        run: |
          quarto render content/slides/

      # Export reveal.js slides to PDF using Decktape (Puppeteer/Chrome-based)
      # --chrome-arg=--no-sandbox required: GitHub Actions runners don't support Chrome sandboxing
      # This is safe in CI environments where the runner is already isolated
      - name: Export slides to PDF with Decktape
        run: |
          for f in docs/content/slides/*.html; do \
            npx decktape reveal "$$f" "$${f%.html}.pdf" --chrome-arg=--no-sandbox; \
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
