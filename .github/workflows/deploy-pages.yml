name: Deploy Quarto Course to GitHub Pages

on:
  # Runs on pushes to main branch
  push:
    branches: ["main"]
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies (Argdown)
        run: |
          npm install decktape
          npm install @argdown/cli
          npm install @argdown/pandoc-filter
          npm install @argdown/image-export

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            inkscape \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-luatex \
            librsvg2-bin

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Install Quarto extensions
        run: |
          quarto add quarto-ext/fontawesome --no-prompt

      - name: Render Quarto website
        run: |
          quarto render

      - name: Render slides
        run: |
          quarto render content/slides/

      - name: Export slides to PDF with Decktape
        run: |
          for f in docs/content/slides/*.html; do \
            npx decktape reveal "$$f" "$${f%.html}.pdf"; \
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
